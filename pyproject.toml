[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlam"
version = "0.1.0"
description = "Reproducibility-constrained execution framework for Large Action Models"
authors = [
    { name = "Suriya Sureshkumar", email = "suriyasureshkumarkannian@gmail.com"},
    { name = "Ivan Nilash X", email = "ivannilash1206@gmail.com"}
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0"
]

[project.urls]
Homepage = "https://github.com/suriyasureshok/rlam"